<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Design scannable QR codes for links, text, email, phone, Wi-Fi and contact cards — with live scan verification. Runs entirely in your browser. Part of the Kehai ecosystem." />
    <meta name="theme-color" content="#05070a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kehai QR Studio — design QR codes that actually scan</title>
    <script>
      // Apply the saved/system theme before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem("kqs.theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f6f3ee");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
